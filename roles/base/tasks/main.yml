# Stop any omero-deployment-kit docker containers first
- name: Check for existing docker compose directory
  stat:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/docker"
  register: omero_docker_dir

- name: stop omero containers
  command: docker compose down
  args:
    chdir: "{{ ansible_user_dir }}/omero-deployment-kit/docker"
  failed_when: false
  changed_when: false
  when: omero_docker_dir.stat.exists and omero_docker_dir.stat.isdir

# APT packages
- name: Install apt-packages
  apt:
    name:
      # General and docker prerequisits
      - wget
      - curl
      - git
      - nfs-common
      - gnupg
      - nginx
      - default-jdk # For keytool command in LDAP certificate management
  become: yes

- name: Mount NFS storage
  mount:
    src: "{{ vault_NFS_fullpath }}"
    path: /mnt/omero_data
    state: mounted
    fstype: nfs
    opts: nfsvers=3,noatime,x-systemd.automount
  become: yes
  when: vault_NFS_fullpath is defined and vault_NFS_fullpath != ""

- name: Create data directory if storage is not mounted
  file:
    path: /mnt/omero_data
    state: directory
    mode: "0755"
  become: yes
  when: vault_NFS_fullpath is not defined or vault_NFS_fullpath == ""


# The following block is intended to correct the ownership of an existing datastore
# from, for example, a prior deployment. The stat condition is here to skip a recursive 
#  permissions check, which would otherwise run every time the playbook runs (very slow!).
# Take care... if your top level permissions are correct this block will be skipped,
# even if the permissions and ownership of files within the directories below it are incorrect.
- name: Ensure OMERO data directory ownership is correct
  block:
    - name: Check ownership of OMERO data directory
      stat:
        path: /mnt/omero_data
      register: omero_data_stat

    - name: Set OMERO data directory ownership (recurses only on mismatch)
      file:
        path: /mnt/omero_data
        owner: "{{ omero_uid }}"
        group: root
        mode: '0750'
        recurse: yes
      when:
        - omero_data_stat.stat.exists
        - omero_data_stat.stat.uid != (omero_uid | int)
          or omero_data_stat.stat.gid != 0
          or omero_data_stat.stat.mode != '0750'
  become: yes

# If a user runs a batch export, the tmp directory can get extremely large
# Move it off the OS disk and mounting as a volume to prevent the server from crashing!
- name: Create OMERO tmp directory on NFS data volume
  file:
    path: /mnt/omero_data/omero_tmp
    state: directory
    owner: "{{ omero_uid }}"
    group: root
    mode: "0750"
  become: yes

- name: Clone omero-deployment-kit repository
  git:
    repo: "{{ deployment_repo }}"
    dest: "{{ ansible_user_dir }}/omero-deployment-kit"
    version: "{{ deployment_branch }}"
    force: yes

- name: Configure system proxy environment
  copy:
    dest: "/etc/environment"
    content: |
      http_proxy={{ vault_proxy_url }}
      https_proxy={{ vault_proxy_url }}
      HTTP_PROXY={{ vault_proxy_url }}
      HTTPS_PROXY={{ vault_proxy_url }}
    mode: "0644"
  become: yes

- name: Create database directory
  file:
    path: "{{ ansible_user_dir }}/omero-deployment-kit/database"
    state: directory
    owner: "{{ postgres_init_uid }}"
    group: "{{ postgres_init_gid }}"
    mode: "0700"
  become: yes
